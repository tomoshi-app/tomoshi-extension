<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="popup.title">Tomoshi 查词</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, "Segoe UI", "Noto Sans CJK JP", sans-serif;
        width: 360px;
        min-height: 200px;
        margin: 0;
        padding: 12px;
        background: #ffffff;
        color: #1a1a1a;
        line-height: 1.5;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .header h1 {
        font-size: 16px;
        margin: 0;
      }
      .status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        background: #eef0f4;
        color: #333;
      }
      .status.ok {
        background: #e3f3e8;
        color: #1d7a44;
      }
      .status.off {
        background: #fdecea;
        color: #b3261e;
      }
      .search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .search-box input {
        flex: 1;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        color: #1a1a1a;
      }
      .search-box button {
        font: inherit;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #4a90d9;
        color: #fff;
        cursor: pointer;
      }
      .search-box button:hover {
        background: #3b7ec4;
      }
      #results {
        max-height: 400px;
        overflow-y: auto;
      }
      /* 有结果时（shared.js renderResult 加 .jd-split）：只滚 .jd-scroll，分类导航固定在底部。 */
      #results.jd-split {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .jd-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      .jd-foot {
        flex-shrink: 0;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #eee;
      }
      .jd-foot > :first-child {
        margin-top: 0;
      }
      /* 词头行：标题换行时发音 / 收藏钮贴住第一行（同 content.js 那份的注释）。 */
      .jd-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 12px;
      }
      .jd-head:first-child {
        margin-top: 0;
      }
      /* 词条 / 语法卡之间的分隔线（shared.js entryWrap），颜色同 .jd-foot 上沿。 */
      .jd-entry + .jd-entry {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #eee;
      }
      .jd-deconj + .jd-entry {
        margin-top: 12px;
      }
      .jd-title {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 2px 8px;
        flex: 1;
        min-width: 0;
      }
      .jd-surface {
        font-size: 18px;
        line-height: 26px;
        font-weight: 600;
        white-space: nowrap;
      }
      .jd-reading {
        font-size: 13px;
        color: #777;
        white-space: nowrap;
      }
      .jd-sense {
        margin: 2px 0 0 2px;
        color: #333;
        font-size: 14px;
      }
      .jd-pos {
        font-size: 12px;
        color: #888;
      }
      .jd-sense-cont {
        margin-left: 1.1em;
      }
      .jd-msg {
        color: #888;
        font-size: 14px;
      }
      .jd-deconj {
        font-size: 12px;
        color: #777;
        margin: 0 0 6px;
        padding: 4px 8px;
        background: #f3f3f3;
        border-radius: 6px;
      }
      /* 语法卡（shared.js renderGrammarCard）：与 content.js 那份同值。 */
      .jd-reg-casual {
        background: #15803d;
      }
      .jd-reg-neutral {
        background: #7c3aed;
      }
      .jd-reg-written {
        background: #1d4ed8;
      }
      .jd-reg-formal {
        background: #b91c1c;
      }
      .jd-g-meaning {
        margin: 4px 0 0 2px;
        font-size: 14px;
        color: #333;
      }
      .jd-g-senses {
        margin: 4px 0 0 2px;
        font-size: 14px;
        padding-left: 1.4em;
        color: #333;
      }
      .jd-g-senses li + li {
        margin-top: 2px;
      }
      .jd-g-sec {
        margin: 8px 0 0 2px;
      }
      .jd-g-sec-title {
        font-size: 11px;
        font-weight: 600;
        color: #888;
        margin-bottom: 2px;
      }
      .jd-g-form {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 6px;
        font-size: 13px;
        line-height: 1.6;
        color: #333;
      }
      .jd-g-form + .jd-g-form,
      .jd-g-form + .jd-g-form-prose,
      .jd-g-form-prose + .jd-g-form {
        margin-top: 4px;
      }
      .jd-g-form-label {
        font-size: 12px;
        color: #888;
      }
      .jd-g-form-note {
        font-size: 12px;
        color: #6b7280;
        padding: 0 6px;
        border-radius: 3px;
        background: #f3f4f6;
      }
      .jd-g-form-prose {
        display: block;
        font-size: 13px;
        line-height: 1.6;
        color: #374151;
      }
      .jd-g-formula {
        padding: 1px 8px;
        border-radius: 4px;
        background: #f3f4f6;
        font-weight: 600;
      }
      .jd-g-fx {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 3px;
      }
      .jd-fx-tag {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid transparent;
        border-radius: 4px;
        font-size: 12px;
        line-height: normal;
      }
      .jd-fx-pos {
        color: #4f46e5;
        background: #eef2ff;
        border-color: #c7d2fe;
      }
      .jd-fx-ja {
        color: #0e7490;
        background: #ecfeff;
        border-color: #a5f3fc;
        font-weight: 600;
      }
      .jd-fx-aside {
        font-size: 0.9em;
        font-weight: 400;
        opacity: 0.75;
      }
      .jd-fx-op {
        font-size: 12px;
        color: #9ca3af;
      }
      .jd-fx-text {
        font-size: 12px;
        color: #374151;
      }
      .jd-g-ex {
        padding-left: 8px;
        border-left: 2px solid #d6dae3;
      }
      .jd-g-ex-jp {
        font-size: 14px;
        color: #222;
      }
      .jd-g-ex-tr {
        font-size: 12px;
        color: #777;
        margin-top: 1px;
      }
      .jd-pitch-slot {
        display: inline-flex;
        align-items: center;
      }
      /* 词头标签章（shared.js makeTags）：与 content.js 那份同值。 */
      .jd-tags {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .jd-tag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        line-height: 1;
        padding: 3px 6px;
        border-radius: 4px;
        color: #fff;
      }
      .jd-tag-jlpt {
        background: #1d4ed8;
        cursor: help;
      }
      .jd-tag-approx {
        font-size: 9px;
        padding: 1px 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.22);
      }
      .jd-tag-common {
        background: #15803d;
      }
      .jd-pitch {
        display: block;
      }
      .jd-pitch-line {
        fill: none;
        stroke: #888;
        stroke-width: 1.5;
      }
      .jd-pitch-drop {
        stroke-dasharray: 1.5 1.5;
      }
      .jd-pitch-dot {
        fill: #4a90d9;
      }
      .jd-pitch-dot-low {
        fill: #888;
      }
      .jd-speak {
        margin: 1px 0 0 auto;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: #999;
        cursor: pointer;
      }
      .jd-speak:hover {
        background: rgba(0, 0, 0, 0.06);
        color: #555;
      }
      .jd-speak-busy {
        opacity: 0.4;
        cursor: default;
      }
      .jd-fav {
        margin-top: 1px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: #b8b8b8;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      .jd-fav:hover {
        background: rgba(0, 0, 0, 0.06);
        color: #f0a500;
      }
      .jd-fav-on {
        color: #f0a500;
      }
      .jd-fav-on:hover {
        color: #f0a500;
        background: rgba(0, 0, 0, 0.06);
      }
      .jd-flash {
        margin-left: 8px;
        font-size: 12px;
        color: #c0392b;
      }
      /* Own line under the header row — see flash()'s `block` option. */
      .jd-flash-block {
        display: block;
        margin: 3px 0 0 2px;
      }
      /* 星标选本行（多生词本，shared.js showDeckPicker）：与 content.js 那份同值。 */
      .jd-deck-pick {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 4px 0 6px 2px;
        padding: 6px 8px;
        border: 1px solid #e6e8ee;
        border-radius: 8px;
        background: #f7f8fa;
      }
      .jd-deck-pick-title {
        font-size: 12px;
        color: #6b7280;
        margin-right: 2px;
      }
      .jd-deck-chip {
        padding: 3px 10px;
        border: 1px solid #d6dae3;
        border-radius: 999px;
        background: #fff;
        color: #333;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.4;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .jd-deck-chip:hover {
        border-color: #4f46e5;
        color: #4f46e5;
        background: #eef2ff;
      }
      .jd-deck-chip-last {
        border-color: #a5b4fc;
      }
      .jd-deck-pick-hint {
        flex-basis: 100%;
        font-size: 11px;
        color: #9ca3af;
      }
      /* 结果分类导航（shared.js appendSectionNav）：与 content.js 那份同值。 */
      .jd-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        margin-top: 12px;
      }
      .jd-nav-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        padding: 2px 8px;
        font-size: 12px;
        line-height: 1.5;
        color: #9ca3af;
        border: 1px solid transparent;
        border-radius: 4px;
        white-space: nowrap;
        background: transparent;
        font-family: inherit;
      }
      .jd-nav-common {
        color: #15803d;
        background: #f0fdf4;
        border-color: #bbf7d0;
      }
      .jd-nav-grammar {
        color: #0e7490;
        background: #ecfeff;
        border-color: #a5f3fc;
      }
      .jd-nav-count {
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      /* 可点的标签（结果区里列了这一类）：同 content.js 那份。 */
      .jd-nav-link {
        cursor: pointer;
      }
      .jd-nav-link:hover {
        border-color: currentColor;
      }
      .footer {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        text-align: left;
      }
      .footer a {
        font-size: 12px;
        color: #4a90d9;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f1f1f;
          color: #ededed;
        }
        .status {
          background: #2b2b2b;
          color: #cccccc;
        }
        .status.ok {
          background: #173a28;
          color: #6ee7a0;
        }
        .status.off {
          background: #3a1f1e;
          color: #f3a39c;
        }
        .jd-foot,
        .jd-entry + .jd-entry {
          border-top-color: #333;
        }
        .search-box input {
          background: #2a2a2a;
          color: #ededed;
          border-color: #444;
        }
        .jd-reading {
          color: #aaa;
        }
        .jd-sense {
          color: #cfcfcf;
        }
        .jd-pos {
          color: #999;
        }
        .jd-msg {
          color: #999;
        }
        .jd-nav-chip {
          color: #757575;
        }
        .jd-nav-common {
          color: #84ab8c;
          background: #202b22;
          border-color: #3c5642;
        }
        .jd-nav-grammar {
          color: #79a6ad;
          background: #1f2b2e;
          border-color: #3a545a;
        }
        .jd-tag-jlpt {
          background: #1e40af;
        }
        .jd-tag-common {
          background: #166534;
        }
        .jd-reg-casual {
          background: #166534;
        }
        .jd-reg-neutral {
          background: #5b21b6;
        }
        .jd-reg-written {
          background: #1e40af;
        }
        .jd-reg-formal {
          background: #991b1b;
        }
        .jd-g-meaning,
        .jd-g-senses,
        .jd-g-form {
          color: #cfcfcf;
        }
        .jd-g-sec-title,
        .jd-g-form-label,
        .jd-g-form-note {
          color: #999;
        }
        .jd-g-form-note,
        .jd-g-formula {
          background: #2a2a2a;
        }
        .jd-g-form-prose,
        .jd-fx-text {
          color: #c0c0c0;
        }
        .jd-fx-pos {
          color: #8f94c9;
          background: #262338;
          border-color: #4a4770;
        }
        .jd-fx-ja {
          color: #79a6ad;
          background: #1f2b2e;
          border-color: #3a545a;
        }
        .jd-fx-op {
          color: #757575;
        }
        .jd-g-ex {
          border-left-color: #444;
        }
        .jd-g-ex-jp {
          color: #e5e5e5;
        }
        .jd-g-ex-tr {
          color: #aaa;
        }
        .jd-speak:hover {
          background: rgba(255, 255, 255, 0.1);
          color: #ddd;
        }
        .jd-fav:hover {
          background: rgba(255, 255, 255, 0.1);
          color: #ffcb47;
        }
        .jd-fav-on {
          color: #ffcb47;
        }
        .jd-fav-on:hover {
          color: #ffcb47;
          background: rgba(255, 255, 255, 0.1);
        }
        .jd-flash {
          color: #e57373;
        }
        .jd-deck-pick {
          background: #2a2a2a;
          border-color: #3a3a3a;
        }
        .jd-deck-pick-title {
          color: #9ca3af;
        }
        .jd-deck-chip {
          background: #1f1f1f;
          border-color: #444;
          color: #ddd;
        }
        .jd-deck-chip:hover {
          border-color: #818cf8;
          color: #c7d2fe;
          background: #2b2d4a;
        }
        .jd-deck-chip-last {
          border-color: #6366f1;
        }
        .jd-deck-pick-hint {
          color: #777;
        }
        .footer a {
          color: #6db3f2;
        }
        .footer {
          border-top-color: #333;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 data-i18n="popup.title">Tomoshi 查词</h1>
      <div class="status" id="status" data-i18n="popup.checking">检测中…</div>
    </div>
    <div class="search-box">
      <input
        type="text"
        id="query"
        data-i18n-placeholder="popup.placeholder"
        placeholder="输入查询内容…"
        autofocus
      />
      <button id="search" data-i18n="popup.search">查询</button>
    </div>
    <div id="results"></div>
    <div class="footer">
      <a href="#" id="open-options" data-i18n="popup.openOptions">打开设置页</a>
    </div>
    <script src="i18n.js"></script>
    <script src="pos.js"></script>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
